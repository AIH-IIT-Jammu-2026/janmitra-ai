name: CI - PR Review Bot

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install fastapi uvicorn pydantic httpx pytest pytest-asyncio

      - name: Run Tests
        id: run_tests
        run: python -m pytest backend/tests -v
        continue-on-error: true

      - name: Post Approved Comment
        if: steps.run_tests.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ✅ PR Approved — All Tests Passed

            **JanMitra AI CI Bot** reviewed this pull request.

            | Check | Status |
            |---|---|
            | Backend Tests | ✅ Passed |
            | pytest | ✅ All assertions passed |

            This PR is **safe to merge** into `main`.

      - name: Post Not Approved Comment
        if: steps.run_tests.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ❌ PR Not Approved — Tests Failed

            **JanMitra AI CI Bot** reviewed this pull request.

            | Check | Status |
            |---|---|
            | Backend Tests | ❌ Failed |
            | pytest | ❌ One or more assertions failed |

            Please fix the failing tests before merging.

      - name: Fail Job if Tests Failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
